version: '3.9'
services:
  db:
    image: postgis/postgis:15-3.4
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: officepool
    ports:
      - "5432:5432"
    volumes:
      - officepool_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: ./backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/officepool
      PORT: 4000
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"

volumes:
  officepool_data:
